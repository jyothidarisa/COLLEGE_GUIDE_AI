<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E8" />
      <stop offset="100%" stop-color="#F8D982" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38352D" />
      <stop offset="100%" stop-color="#1F1D19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C64F" />
      <stop offset="100%" stop-color="#D49A1F" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38352D" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#EAE2D1" stroke-width="6" />

  <!-- Inner subtle border glow -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" />

  <!-- Graduation Cap & AI Sparkles Group -->
  <g filter="url(#subtleShadow)">
    <!-- Cap Top Diamond -->
    <polygon points="256,130 410,205 256,280 102,205" fill="url(#capGrad)" />

    <!-- Cap Skull Base -->
    <path d="M160,235 L160,310 C160,355 352,355 352,310 L352,235" fill="url(#capGrad)" opacity="0.95" />

    <!-- Tassel String and Fringe -->
    <path d="M256,205 C290,225 385,240 388,295" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" />
    <circle cx="388" cy="305" r="9" fill="url(#accentGrad)" />
    <path d="M384,312 L380,345 M388,314 L388,348 M392,312 L396,345" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Cap Button Top -->
    <circle cx="256" cy="205" r="9" fill="url(#accentGrad)" />

    <!-- Open Book / Wings underneath -->
    <path d="M140,360 Q256,380 256,410 Q256,380 372,360 Q340,405 256,418 Q172,405 140,360 Z" fill="#38352D" opacity="0.85" />

    <!-- AI Sparkle 1 (Top Right) -->
    <path d="M395,120 Q405,120 405,110 Q405,120 415,120 Q405,120 405,130 Q405,120 395,120 Z" fill="url(#accentGrad)" />
    <!-- AI Sparkle 2 (Top Left) -->
    <path d="M95,160 Q105,160 105,150 Q105,160 115,160 Q105,160 105,170 Q105,160 95,160 Z" fill="url(#accentGrad)" />
  </g>
</svg>
